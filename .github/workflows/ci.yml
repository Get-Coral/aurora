name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Typecheck
        run: vp run typecheck

      - name: Lint
        run: vp check

      - name: Run tests
        run: vp test run --passWithNoTests

      - name: Build app
        run: vp build

      - name: Build Docker image
        run: docker build . --tag aurora-ui:ci

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor assets
        run: pnpm cap:sync

      # The Quest build compiles its theater shader with the NDK version the
      # Android Gradle plugin expects; the runner image doesn't ship that one.
      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null

      - name: Assemble Android debug build
        run: pnpm android:assemble:debug
